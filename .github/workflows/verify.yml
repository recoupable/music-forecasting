name: Verify benchmarks
on: [pull_request, push]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m forecasting.benchmark > "$RUNNER_TEMP/attention-results.json"
      - run: diff -u experiments/attention-results.json "$RUNNER_TEMP/attention-results.json"
